name: mane-dev
services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: mane
      POSTGRES_USER: mane
      POSTGRES_PASSWORD: mane
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mane -d mane']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 384m
    shm_size: 128m
    restart: unless-stopped
volumes:
  postgres:
