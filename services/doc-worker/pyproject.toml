[project]
name = "mane-doc-worker"
version = "0.1.0"
description = "Offline meeting transcription, evidence-grounded minutes, and document generation for Mane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "jsonschema[format]>=4.23,<5",
  "python-docx>=1.1,<2", "boto3>=1.35,<2",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin'"]
cuda = ["faster-whisper>=1.1,<2"]
diarization = ["pyannote.audio>=3.3,<4"]
test = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
mane-worker = "mane_worker.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mane_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
